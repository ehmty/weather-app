<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>
  <body>
    <div class="weather-widget">
      <div class="header">
        <h1>Weather</h1>
        <button>
          <span class="celsius">°C</span>
          <span class="fahrenheit">°F</span>
        </button>
      </div>
      <form class="search-bar">
        <input type="image" src="./asset/magnify.svg" alt="search" />
        <input type="text" placeholder="London" />
      </form>
      <div class="content"></div>
    </div>
  </body>
</html>
