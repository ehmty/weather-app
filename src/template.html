<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>
  <body>
    <div class="weather-widget">
      <div class="header">
        <h1>Weather</h1>
        <button>
          <span class="celsius active">°C</span>
          <span class="fahrenheit">°F</span>
        </button>
      </div>
      <form class="search-bar">
        <input type="image" src="./asset/magnify.svg" alt="search" />
        <input
          type="text"
          id="location"
          name="location"
          placeholder="Enter a location..."
        />
      </form>

      <div class="weather-content">
        <div class="current-weather"></div>

        <div class="forecast"></div>
      </div>
    </div>

    <div class="credit">
      Photo by
      <a
        href="https://unsplash.com/de/@onefabian?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        >Fabian Quintero</a
      >
      on
      <a
        href="https://unsplash.com/de/fotos/luftaufnahme-vom-emerald-bay-state-park-UWQP2mh5YJI?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        >Unsplash</a
      >
    </div>
  </body>
</html>
