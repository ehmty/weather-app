<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
  </head>
  <body>
    <div class="weather-widget">
      <div class="header">
        <h1>Weather</h1>
        <button>
          <span class="celsius">°C</span>
          <span class="fahrenheit">°F</span>
        </button>
      </div>
      <form class="search-bar">
        <input type="image" src="./asset/magnify.svg" alt="search" />
        <input type="text" placeholder="London" />
      </form>

      <div class="weather-content">
        <div class="current-weather">
          <div class="location-info">
            <h2></h2>
            <p></p>
          </div>

          <div class="weather-main">
            <img alt="icon" />
            <div class="temperature">
              <div class="temp-value"></div>
              <div class="condition"></div>
            </div>
          </div>

          <div class="weather-details">
            <div class="detail">
              <img alt="icon" />
              <div></div>
              <div class="feels-like"></div>
            </div>

            <div class="detail">
              <img alt="icon" />
              <div></div>
              <div class="humidity"></div>
            </div>

            <div class="detail">
              <img alt="icon" />
              <div></div>
              <div class="wind"></div>
            </div>
          </div>
        </div>

        <div class="forecast">
          <div class="forecast-day">
            <div class="weekday"></div>
            <img alt="icon" />
            <div class="tempmax"></div>
            <div class="tempmin"></div>
          </div>

          <div class="forecast-day">
            <div class="weekday"></div>
            <img alt="icon" />
            <div class="tempmax"></div>
            <div class="tempmin"></div>
          </div>

          <div class="forecast-day">
            <div class="weekday"></div>
            <img alt="icon" />
            <div class="tempmax"></div>
            <div class="tempmin"></div>
          </div>

          <div class="forecast-day">
            <div class="weekday"></div>
            <img alt="icon" />
            <div class="tempmax"></div>
            <div class="tempmin"></div>
          </div>

          <div class="forecast-day">
            <div class="weekday"></div>
            <img alt="icon" />
            <div class="tempmax"></div>
            <div class="tempmin"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="credit">
      Photo by
      <a
        href="https://unsplash.com/de/@onefabian?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        >Fabian Quintero</a
      >
      on
      <a
        href="https://unsplash.com/de/fotos/luftaufnahme-vom-emerald-bay-state-park-UWQP2mh5YJI?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
        >Unsplash</a
      >
    </div>
  </body>
</html>
